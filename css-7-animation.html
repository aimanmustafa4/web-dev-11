<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Animation</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        .animation {
            width: 100px;
            height: 100px;
            border: 9px solid transparent;
            border-top: 9px solid #000;
            margin: 200px;
            padding: 20px;
            border-radius: 50%;
            animation: spinner 5s ease .5s infinite normal;
        }

        @keyframes spinner {
            0% {
                width: 100px;
                height: 100px;
                border: 9px solid transparent;
                border-top: 9px solid #000;
                margin: 200px;
                padding: 20px;
                border-radius: 50%;

            }
            20% {
                border: 9px solid transparent;
                border-top: 9px solid #1de40f;
                border-radius: 50%;
                transform: rotate(50deg);
            }
            40% {
                border: 9px solid transparent;
                border-top: 9px solid #e20758;
                border-radius: 50%;
                transform: rotate(75deg);
            }
            60% {
                border: 9px solid transparent;
                border-top: 9px solid #180335;
                border-radius: 50%;
                transform: rotate(100deg);
            }
            80% {
                border: 9px solid transparent;
                border-top: 9px solid #e4d508;
                border-radius: 50%;
                transform: rotate(190deg);
            }

            100% {
                border: 9px solid transparent;
                border-top: 9px solid #d36a0e;
                border-radius: 50%;
                transform: rotate(360deg);
            }
        }
    </style>
</head>

<body>
    <div class="animation">
    </div>
</body>

</html>
