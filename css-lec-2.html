<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        /* universal selector */
        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        /* class selector */
        .head{
            background: palevioletred;
        }
        /* tag selector */
        p{
          background-color: aqua;

        }
        /* id selector */
        #btn{
            background-color: brown;
            color: white;
        }
    </style>
</head>
<body>
    <!-- selectors are of 4 types
     1- universal selector (*) 
     2- tag/element selector (tags used)
     3- class selector (.)
     4- id selector (#) -->

     <h1 class="head">Css</h1>
     <p >Lorem ipsum dolor sit, amet consectetur adipisicing elit. Laudantium numquam placeat aperiam quam nostrum accusantium sequi id assumenda odio? Delectus sed pariatur voluptate eligendi hic dolor! Repellat magni ipsum maxime?</p>
     <p>hy</p>
     <button id="btn">Add here</button>
</body>
</html>
