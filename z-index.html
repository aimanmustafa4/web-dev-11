<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .parent {
            display: flex;
            justify-content: space-around;
        }

        .box1 {
            width: 100px;
            height: 100px;
            background-color: red;
            position: relative;
            z-index: 5;

        }

        .box2 {
            width: 100px;
            height: 100px;
            background-color: green;
            position: relative;
            top: 20px;
            right: 200px;
            z-index: 4;

        }

        .box3 {
            width: 100px;
            height: 100px;
            background-color: blue;
            position: relative;
            top: 40px;
            right: 400px;
            z-index: 3;

        }

        .box4 {
            width: 100px;
            height: 100px;
            background-color: yellow;
            position: relative;
            top: 60px;
            right: 600px;
            z-index: 2;

        }

        .box5 {
            width: 100px;
            height: 100px;
            background-color: purple;
            position: relative;
            top: 80px;
            right: 800px;

        }
    </style>
</head>

<body>
    <div class="parent">
        <div class="box1"></div>
        <div class="box2"></div>
        <div class="box3"></div>
        <div class="box4"></div>
        <div class="box5"></div>
    </div>
</body>

</html>
