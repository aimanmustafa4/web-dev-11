<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        .box{
            background-color: coral;
            width: 600px;
            height: 200px;
            /* border-width: 3px ;
            border-style: solid ;
            border-color: black; */
            border: 3px solid black;
            border-radius: 10px;
            box-shadow: 5px 5px 10px black;
        }
        
        .head{
            color: rgb(88, 33, 33);
            font-family: Georgia, 'Times New Roman', Times, serif;
            font-size: 30px;
            font-weight: lighter;
            font-style: italic;
            text-decoration: 3px wavy underline;
            text-align: start;

         }

    </style>
</head>
<body>
    <div class="box">
        <h1 class="head">Css Properties</h1>
        <p>Css stands for Cascading Style Sheet</p>
        <button>Click Here</button>
        <p>Lorem ipsum dolor sit amet consectetur.</p>
    </div>
    
</body>
</html>
