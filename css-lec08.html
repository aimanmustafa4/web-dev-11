<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>z-index</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        .parent{
            display: flex;
            justify-content: space-evenly;
            align-items: center;
            /* background-color: aquamarine    ; */
        }

        .box1 {
            width: 200px;
            height: 200px;
            background-color: blueviolet;
            margin: 20px;
            border: 3px solid black;
            z-index: 5;
            
        }
        .box2 {
            width: 200px;
            height: 200px;
            background-color: greenyellow;
            margin: 20px;
            border: 3px solid black;
            position: relative;
            top: 60px;
            right: 200px;
            z-index: 4;
        }
        .box3 {
            width: 200px;
            height: 200px;
            background-color: red;
            margin: 20px;
            border: 3px solid black;
            position: relative;
            top: 120px;
            right: 400px;
            z-index: 3;
        }
        .box4 {
            width: 200px;
            height: 200px;
            background-color: orange;
            margin: 20px;
            border: 3px solid black;
            position: relative;
            top: 180px;
            right: 600px;
            z-index: 2;
        }
        .box5 {
            width: 200px;
            height: 200px;
            background-color: blue;
            margin: 20px;
            border: 3px solid black;
            position: relative;
            top: 240px;
            right: 800px;  
            z-index: 1; 
        }
    </style>
</head>

<body>
    <div class="parent">
        <div class="box1"></div>
        <div class="box2"></div>
        <div class="box3"></div>
        <div class="box4"></div>
        <div class="box5"></div>
    </div>
</body>

</html>
