<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Css styling types</title>
    <!-- <link rel="stylesheet" href="css-lec-1.css"> -->
    <style>
        h1 {
            background-color: black;
            color: white;
        }
    </style>
</head>

<body>
    <!-- inline styling -->
    <h1 style="background-color: brown; color: cornsilk; width: 200px; height: 200px;">Cascading Style Sheet</h1>

    <!-- internal styling use style tag in the head-->
    <h1>Cascading Style Sheet</h1>

    <!-- external styling is linked in the head part through link tag -->
    <h1>Cascading Style Sheet</h1>
</body>

</html>
