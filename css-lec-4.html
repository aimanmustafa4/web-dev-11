<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Margin and Padding</title>
    <style>
        *{
            margin: 0;
            padding: 0;
        }
        .box1{
            width: 200px;
            height: 200px;
            background-color: black;
            color: white;
            padding: 30px;
            margin: 100px;
            border: 20px solid rgb(0, 0, 0);
            text-align: center;
            
        }
        .box2{
            width: 200px;
            height: 200px;
            background-color: red; 
            color: black;
            margin: 100px;
            text-align: center;
            text-decoration:  underline ;
            font-family: fantasy;
            font-size: 70px;
            font-weight: lighter;
            font-style: normal;
            border: 10px double black;
            border-radius: 19px;
            box-shadow: 10px 10px 10px black;

        }
    </style>
</head>
<body>
    <div class="box1">
        Box1 is black
    </div>
    <div class="box2">
        Box2 is red
    </div>
    
</body>
</html>
